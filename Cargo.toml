# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-iso-tp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-iso-tp"
description = "ISO-TP transport: ISO 15765-2 over CAN — single, first, consecutive and flow-control frames segment a payload of up to 4095 bytes across the bus and reassemble it, block size and separation time from the receiver. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The carrier, declared in architecture.toml: the bus, the frame and the
# loopback every CAN protocol rides on come from can-bus, never copied.
can_bus = { package = "xmip-core-transport-can-bus", git = "https://github.com/IlleNilsson/xmip-core-transport-can-bus", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
